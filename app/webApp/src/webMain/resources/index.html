<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#174A3C">
    <meta name="description" content="Treasury is your personal finance calendar. Plan income, bills, subscriptions, and payments with manual entry and a clearer view of your balance.">
    <title>Treasury — Your money, in perspective</title>
    <link rel="icon" href="treasury.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="treasury-loading" class="launch" aria-labelledby="launch-title">
        <img src="treasury.svg" alt="" width="76" height="76">
        <h1 id="launch-title">treasury.</h1>
        <p>Your money, in perspective.</p>
        <div class="loading-line" aria-hidden="true"></div>
        <p id="launch-status" class="status" role="status">Opening your calendar…</p>
        <button id="launch-reload" type="button" hidden>Reload Treasury</button>
        <noscript><p>Enable JavaScript to open Treasury. Your stored records stay in this browser.</p></noscript>
    </main>
    <script src="bootstrap.js"></script>
    <script src="webApp.js"></script>
</body>
</html>
